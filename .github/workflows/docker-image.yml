name: CI/CD to Kubernetecs Cluster

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read
  packages: write

jobs:
  # This workflow contains a single job called "build"
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Code Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
      
      - name: Build with Maven
        run: mvn clean package
      
      - name: Build Docker Image
        run:  |
          docker build -t adha/patient-mgnt-fhir-api:latest .
          docker tag adha/patient-mgnt-fhir-api:latest adha/patient-mgnt-fhir-api:${ GITHUB_SHA::7 }
          
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: Upload Docker Image to Docker Hub
        run:  |
          docker push adha/patient-mgnt-fhir-api:latest
          docker push adha/patient-mgnt-fhir-api:${ GITHUB_SHA::7 }
