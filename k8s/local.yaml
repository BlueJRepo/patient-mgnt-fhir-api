apiVersion: apps/v1
kind: Deployment
metadata:
  name: patient-mgnt-fhir-api-deployment
  labels:
    app: patient-mgnt-fhir-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: patient-mgnt-fhir-api
  template:
    metadata:
      labels:
        app: patient-mgnt-fhir-api
    spec:
      containers:
      - name: patient-mgnt-fhir-api-container
        # Replace with your actual Docker registry and image tag
        image: adha/patient-mgnt-fhir-api:v1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8081
        # Resource management to ensure cluster stability
        resources:
          limits:
            cpu: "1"
            memory: "512Mi"
          requests:
            cpu: "500m"
            memory: "256Mi"
        # Environment variables for Spring Boot config (optional)
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: "local"
        # Health probes (Requires spring-boot-starter-actuator dependency)
        livenessProbe:
          httpGet:
            path: /api/actuator/health/liveness
            port: 8081
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/actuator/health/readiness
            port: 8081
          initialDelaySeconds: 30
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: patient-mgnt-fhir-api-service
spec:
  type: ClusterIP      # Use LoadBalancer instead if deploying to cloud (AWS, GCP, Azure)
  #type: LoadBalancer # Change from ClusterIP to LoadBalancer
  #type: NodePort # or LoadBalancer for Docker Desktop
  selector:
    app: patient-mgnt-fhir-api
  ports:
    - protocol: TCP
      port: 9081        # Port exposed outside the cluster
      targetPort: 8081 # Internal port your Spring Boot app listens on
      #nodePort: 30080  # If using NodePort
